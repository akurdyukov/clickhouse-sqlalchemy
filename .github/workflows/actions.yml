on: [push, pull_request]
name: build
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        include:
          - clickhouse-version: 18.14.9
            clickhouse-org: yandex
          - clickhouse-version: 19.3.5
            clickhouse-org: yandex
          - clickhouse-version: 22.5.1.2079
            clickhouse-org: clickhouse
          - clickhouse-version: 23.8.4.69
            clickhouse-org: clickhouse
    services:
      clickhouse-server:
        image: ${{ matrix.clickhouse-org }}/clickhouse-server:${{ matrix.clickhouse-version }}
        ports:
          - 8123:8123
          - 9000:9000

    name: ${{ matrix.python-version }} CH=${{ matrix.clickhouse-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install test requirements
        run: |
          pip install --upgrade pip setuptools wheel
          pip install flake8 flake8-print coverage
          python testsrequire.py
          pip install -e .
          # Limit each test time execution.
          pip install pytest-timeout
      - name: Run flake8
        run: flake8
      - name: Run tests
        run: coverage run --source=clickhouse_sqlalchemy -m pytest --timeout=10 -v
        timeout-minutes: 2
      - name: Generate coverage report
        run: coverage xml
      - name: Upload coverage
        # Not every fork is registered on coveralls.io.
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          parallel: true
          flag-name: ${{ matrix.python-version }} CH=${{ matrix.clickhouse-version }}

  coveralls-finished:
    name: Indicate completion to coveralls.io
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Finished
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
