on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
name: publish

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check tag matches package version
        run: |
          version=$(python -c "import re; print(re.search(r'^VERSION = \((.*)\)', open('clickhouse_sqlalchemy/__init__.py').read(), re.M).group(1).replace(', ', '.'))")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/clickhouse-sqlalchemy-ng/
    permissions:
      # PyPI trusted publishing; no API token is stored in the repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
